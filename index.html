<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>家庭头像小游戏</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="title-group">
          <p class="kicker">Family Match</p>
          <h1>家庭头像小游戏</h1>
          <div class="mode-switch" aria-label="玩法切换">
            <button class="mode-button active" id="match3ModeButton" type="button">消消乐</button>
            <button class="mode-button" id="linkModeButton" type="button">连连看</button>
          </div>
        </div>
        <section class="stats" aria-label="游戏状态">
          <div class="stat">
            <span>分数</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span id="counterLabel">步数</span>
            <strong id="moves">30</strong>
          </div>
          <button class="sound-button" id="soundButton" type="button" aria-pressed="true">音效：开</button>
          <button class="reset-button icon-button" id="restartButton" type="button" aria-label="重新开始" title="重新开始">↻</button>
        </section>
      </header>

      <section class="content">
        <aside class="family-panel" aria-label="家庭成员头像说明">
          <h2>家庭成员</h2>
          <div class="legend" id="legend"></div>
        </aside>

        <section class="board-wrap" aria-label="9乘9家庭头像棋盘">
          <div class="mode-note" id="modeNote"></div>
          <div class="board" id="board"></div>
        </section>
      </section>
    </main>

    <div class="modal hidden" id="gameOverModal" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="modal-card">
        <p class="kicker">Game Over</p>
        <h2 id="gameOverTitle">游戏结束</h2>
        <p>最终得分</p>
        <strong id="finalScore">0</strong>
        <button class="reset-button modal-reset-button" id="modalRestartButton" type="button">再来一局</button>
      </div>
    </div>

    <script src="avatar.js"></script>
    <script src="utils.js"></script>
    <script src="board.js"></script>
    <script src="match3.js"></script>
    <script src="linkGame.js"></script>
    <script src="game.js"></script>
  </body>
</html>
